# /etc/nginx/sites-available/my-app
#
# Server block phuc vu web tinh tu phan vung /opt/ (add-on software)
# va ghi log truc tiep vao /opt/my-app/logs/.
#
# Kich hoat:
#   sudo ln -s /etc/nginx/sites-available/my-app /etc/nginx/sites-enabled/my-app
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name my-app.local;

    # Ma nguon web tinh nam ngoai phan vung mac dinh (/var/www)
    root /opt/my-app/html;
    index index.html index.htm;

    # Log rieng cua du an, tach khoi /var/log/nginx/
    access_log /opt/my-app/logs/access.log;
    error_log  /opt/my-app/logs/error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }
}
