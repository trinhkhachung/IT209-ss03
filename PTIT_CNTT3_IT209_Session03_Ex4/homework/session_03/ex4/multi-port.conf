# =============================================================================
# File: /etc/nginx/sites-available/multi-port.conf
# Mô tả: Cấu hình Nginx Virtual Hosts chạy song song hai trang tĩnh
#        trên cùng một Droplet thông qua hai cổng dịch vụ khác nhau.
#
# IT209 – Session 03 – Exercise 04: Nginx Virtual Hosts
# =============================================================================


# -----------------------------------------------------------------------------
# Server Block 1: Beta App – Cổng 8080
# Môi trường kiểm thử ứng dụng
# -----------------------------------------------------------------------------
server {
    listen 8080;                        # Lắng nghe trên cổng 8080 (IPv4)
    listen [::]:8080;                   # Lắng nghe trên cổng 8080 (IPv6)

    server_name _;                      # Nhận mọi tên miền / địa chỉ IP

    root /var/www/beta-app/html;        # Thư mục gốc chứa mã nguồn Beta App
    index index.html;                   # File mặc định khi truy cập thư mục

    # Ghi log riêng cho từng virtual host để dễ theo dõi
    access_log /var/log/nginx/beta-app.access.log;
    error_log  /var/log/nginx/beta-app.error.log;

    location / {
        # Thử tìm file theo đường dẫn, nếu không có thì tìm thư mục,
        # nếu vẫn không có thì trả về lỗi 404.
        try_files $uri $uri/ =404;
    }
}


# -----------------------------------------------------------------------------
# Server Block 2: Internal App – Cổng 8090
# Trang thông tin nội bộ
# -----------------------------------------------------------------------------
server {
    listen 8090;                        # Lắng nghe trên cổng 8090 (IPv4)
    listen [::]:8090;                   # Lắng nghe trên cổng 8090 (IPv6)

    server_name _;                      # Nhận mọi tên miền / địa chỉ IP

    root /var/www/internal-app/html;    # Thư mục gốc chứa mã nguồn Internal App
    index index.html;                   # File mặc định khi truy cập thư mục

    # Ghi log riêng cho từng virtual host để dễ theo dõi
    access_log /var/log/nginx/internal-app.access.log;
    error_log  /var/log/nginx/internal-app.error.log;

    location / {
        # Thử tìm file theo đường dẫn, nếu không có thì tìm thư mục,
        # nếu vẫn không có thì trả về lỗi 404.
        try_files $uri $uri/ =404;
    }
}
