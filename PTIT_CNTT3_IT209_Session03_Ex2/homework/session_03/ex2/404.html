<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trang không tìm thấy - Lỗi 404">
    <title>404 - Trang Không Tìm Thấy | My Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary:   #0a0e1a;
            --bg-secondary: #0f1629;
            --accent-cyan:  #00d4ff;
            --accent-blue:  #4f8ef7;
            --accent-purple:#a855f7;
            --text-primary: #e2e8f0;
            --text-muted:   #64748b;
            --glow-cyan:    0 0 20px rgba(0, 212, 255, 0.4);
            --glow-blue:    0 0 40px rgba(79, 142, 247, 0.2);
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(79, 142, 247, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 70%, rgba(168, 85, 247, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 50% 10%, rgba(0, 212, 255, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--accent-cyan);
            opacity: 0;
            animation: float-particle linear infinite;
        }

        @keyframes float-particle {
            0%   { transform: translateY(110vh) scale(0); opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(79, 142, 247, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 142, 247, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            gap: 1.5rem;
        }

        .error-code {
            font-size: clamp(8rem, 20vw, 14rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            animation: glitch-pulse 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.3));
        }

        .error-code::before,
        .error-code::after {
            content: '404';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-code::before {
            animation: glitch-left 4s ease-in-out infinite;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
        }

        .error-code::after {
            animation: glitch-right 4s ease-in-out infinite;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
        }

        @keyframes glitch-pulse {
            0%, 90%, 100% { filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.3)); }
            92%            { filter: drop-shadow(0 0 50px rgba(0, 212, 255, 0.7)) brightness(1.2); }
            94%            { filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.3)); }
            96%            { filter: drop-shadow(0 0 50px rgba(168, 85, 247, 0.7)) brightness(1.2); }
        }

        @keyframes glitch-left {
            0%, 89%, 100% { transform: none; opacity: 0; }
            90%           { transform: translate(-3px, -1px); opacity: 0.7; }
            91%           { transform: translate(3px, 1px); opacity: 0; }
        }

        @keyframes glitch-right {
            0%, 92%, 100% { transform: none; opacity: 0; }
            93%           { transform: translate(3px, 1px); opacity: 0.7; }
            94%           { transform: translate(-3px, -1px); opacity: 0; }
        }

        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-purple), transparent);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%;
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            animation: shimmer 2.5s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%   { left: -100%; }
            100% { left: 200%; }
        }

        .error-title {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .error-desc {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 300;
            color: var(--text-muted);
            max-width: 480px;
            line-height: 1.7;
        }

        .error-desc strong {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .action-card {
            background: rgba(15, 22, 41, 0.8);
            border: 1px solid rgba(79, 142, 247, 0.2);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--glow-blue);
            animation: card-appear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        }

        @keyframes card-appear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .path-display {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid rgba(100, 116, 139, 0.2);
            word-break: break-all;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(79, 142, 247, 0.35);
        }

        .btn-home::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(79, 142, 247, 0.5);
        }

        .btn-home:hover::before { opacity: 1; }
        .btn-home:active { transform: translateY(0); }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            padding: 0.3rem 0.8rem;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 50px;
            background: rgba(0, 212, 255, 0.06);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%       { transform: scale(1.5); opacity: 0.5; }
        }

        .footer-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.6;
        }

        @media (max-width: 480px) {
            .container { gap: 1rem; padding: 1.5rem; }
            .action-card { padding: 1.2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="grid-overlay" aria-hidden="true"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>

    <main class="container" role="main">

        <div class="status-badge" aria-label="Trang thái lỗi HTTP 404">
            <span class="status-dot"></span>
            HTTP 404 &mdash; Not Found
        </div>

        <h1 class="error-code" aria-label="Lỗi 404">404</h1>

        <div class="divider" role="separator"></div>

        <h2 class="error-title">Trang Không Tìm Thấy</h2>

        <p class="error-desc">
            Đường dẫn bạn yêu cầu <strong id="requested-path"></strong>
            không tồn tại hoặc đã bị xóa khỏi máy chủ.
            Vui lòng kiểm tra lại URL hoặc quay về trang chủ.
        </p>

        <div class="action-card" role="complementary" aria-label="Thông tin lỗi và tùy chọn điều hướng">
            <p class="path-display" id="path-display">Đường dẫn không tồn tại</p>
            <a href="/" class="btn-home" id="btn-home" aria-label="Quay về trang chủ">
                &#8592; Quay về Trang Chủ
            </a>
        </div>

        <p class="footer-note">Powered by Nginx &bull; Custom Error Pages</p>

    </main>

    <script>
        (function () {
            var path = window.location.pathname;
            var pathEl = document.getElementById('path-display');
            var inlineEl = document.getElementById('requested-path');
            if (path && path !== '/') {
                pathEl.textContent = window.location.href;
                if (inlineEl) inlineEl.textContent = '"' + path + '"';
            } else {
                if (inlineEl) inlineEl.textContent = 'này';
            }
        })();

        (function () {
            var container = document.getElementById('particles');
            var colors = ['#00d4ff', '#4f8ef7', '#a855f7', '#60a5fa'];
            for (var i = 0; i < 25; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                var size = Math.random() * 4 + 1;
                p.style.cssText = [
                    'width:'  + size + 'px',
                    'height:' + size + 'px',
                    'left:'   + Math.random() * 100 + '%',
                    'bottom:' + (-size) + 'px',
                    'background:' + colors[Math.floor(Math.random() * colors.length)],
                    'animation-duration:' + (Math.random() * 12 + 8) + 's',
                    'animation-delay:'    + (Math.random() * 8) + 's'
                ].join(';');
                container.appendChild(p);
            }
        })();
    </script>

</body>
</html>
