server {
    listen 80;
    listen [::]:80;

    # Thay <YOUR_SERVER_IP> bang dia chi IP cua Droplet
    server_name <YOUR_SERVER_IP>;

    # Thu muc goc cua website
    root /var/www/my-web/html;
    index index.html index.htm;

    # Xu ly cac request den trang chu va cac file tinh
    location / {
        try_files $uri $uri/ =404;
    }

    # Cau hinh trang loi 404 tuy chinh
    error_page 404 /404.html;

    # Bao ve file 404.html - chi Nginx moi co the phuc vu, nguoi dung
    # khong the truy cap truc tiep qua URL (internal)
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }
}
